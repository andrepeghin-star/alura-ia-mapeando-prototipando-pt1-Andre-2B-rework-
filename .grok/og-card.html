<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Outfit;
        src: url("fonts/outfit-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #041114;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
      .lockup {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-family: Outfit, "Liberation Sans", sans-serif;
        font-weight: 700;
        font-size: 128px;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        line-height: 0.9;
        color: #ecfeff;
        text-shadow:
          0 0 1px rgba(94, 234, 212, 0.9),
          0 10px 28px rgba(4, 17, 20, 0.75);
      }
      .rule {
        width: 168px;
        height: 3px;
        margin-top: 34px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          #5eead4 20%,
          #ecfeff 50%,
          #5eead4 80%,
          transparent
        );
        box-shadow: 0 0 16px rgba(94, 234, 212, 0.65);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
        <defs>
          <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#072126" />
            <stop offset="0.45" stop-color="#041114" />
            <stop offset="1" stop-color="#02090b" />
          </linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5eead4" stop-opacity="0" />
            <stop offset="0.18" stop-color="#5eead4" stop-opacity="0.55" />
            <stop offset="0.5" stop-color="#ecfeff" stop-opacity="0.72" />
            <stop offset="0.82" stop-color="#5eead4" stop-opacity="0.5" />
            <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ecfeff" stop-opacity="0.95" />
            <stop offset="0.18" stop-color="#5eead4" stop-opacity="0.55" />
            <stop offset="0.55" stop-color="#134e4a" stop-opacity="0.35" />
            <stop offset="1" stop-color="#041114" stop-opacity="0.05" />
          </linearGradient>
          <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
            <feGaussianBlur stdDeviation="18" />
          </filter>
          <filter id="mist" x="-30%" y="-80%" width="160%" height="260%">
            <feGaussianBlur stdDeviation="28" />
          </filter>
          <filter id="spec" x="-10%" y="-40%" width="120%" height="180%">
            <feGaussianBlur stdDeviation="2.2" />
          </filter>
        </defs>
        <rect width="1200" height="630" fill="url(#ink)" />
        <ellipse cx="600" cy="318" rx="420" ry="170" fill="#0e3a3a" opacity="0.55" filter="url(#mist)" />
        <ellipse cx="430" cy="250" rx="180" ry="70" fill="#5eead4" opacity="0.22" filter="url(#soft)" />
        <ellipse cx="820" cy="390" rx="210" ry="80" fill="#ecfeff" opacity="0.12" filter="url(#soft)" />
        <path
          d="M-80 390 C 160 210, 340 500, 600 340 S 1020 180, 1300 360"
          fill="none"
          stroke="#5eead4"
          stroke-width="168"
          stroke-linecap="round"
          opacity="0.16"
          filter="url(#mist)"
        />
        <path
          d="M-60 372 C 180 200, 360 488, 610 328 S 1000 196, 1280 348"
          fill="none"
          stroke="url(#glassBody)"
          stroke-width="92"
          stroke-linecap="round"
        />
        <path
          d="M-40 338 C 190 176, 370 452, 610 300 S 990 176, 1260 318"
          fill="none"
          stroke="#ecfeff"
          stroke-width="7"
          stroke-linecap="round"
          opacity="0.92"
          filter="url(#spec)"
        />
        <path
          d="M120 410 C 280 470, 420 250, 620 360 S 900 470, 1100 300"
          fill="none"
          stroke="#5eead4"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.45"
        />
        <circle cx="286" cy="268" r="5" fill="#ecfeff" opacity="0.9" />
        <circle cx="304" cy="286" r="2.5" fill="#5eead4" />
        <circle cx="918" cy="392" r="4" fill="#ecfeff" opacity="0.75" />
        <circle cx="948" cy="368" r="2" fill="#ecfeff" opacity="0.55" />
        <circle cx="560" cy="214" r="2" fill="#ecfeff" opacity="0.5" />
      </svg>
      <div class="lockup">
        <h1>FLUXO</h1>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
